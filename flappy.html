<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLAPPY BLUES 🚀 NEXT-GEN EDITION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000208;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Orbitron',sans-serif}
canvas{border:2px solid #00f0ff;box-shadow:0 0 60px rgba(0,240,255,0.5);border-radius:16px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="game" width="420" height="650"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let state = 'start';
let score = 0;
let best = localStorage.getItem('flappyBest') || 0;
let gravity = 0.38;
let jump = -7.5;
let speed = 3.2;

const rocket = {x:90,y:canvas.height/2,w:45,h:32,vy:0,power:0};
let pipes = [];
const pipeW = 65;
const gapH = 160;

const bg = ctx.createLinearGradient(0,0,0,canvas.height);
bg.addColorStop(0,'#001030');
bg.addColorStop(1,'#000208');

function drawRocket(){
  rocket.power = Math.min(rocket.power+0.25, 1);
  ctx.fillStyle = '#00f0ff';
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.moveTo(rocket.x+rocket.w, rocket.y+rocket.h/2);
  ctx.lineTo(rocket.x, rocket.y+2);
  ctx.lineTo(rocket.x+12, rocket.y+rocket.h/2);
  ctx.lineTo(rocket.x, rocket.y+rocket.h-2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#00a8cc';
  ctx.fillRect(rocket.x+15, rocket.y+8, 12, 16);
  ctx.fillStyle = `rgba(0,255,213,${rocket.power})`;
  ctx.shadowColor = '#00ffd5';
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.moveTo(rocket.x, rocket.y+rocket.h/2-6);
  ctx.lineTo(rocket.x-20*rocket.power, rocket.y+rocket.h/2);
  ctx.lineTo(rocket.x, rocket.y+rocket.h/2+6);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawPipes(){
  pipes.forEach(p => {
    const grad = ctx.createLinearGradient(p.x,0,p.x+pipeW,0);
    grad.addColorStop(0,'#0066ff');
    grad.addColorStop(1,'#00f0ff');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 15;
    ctx.fillRect(p.x,0,pipeW,p.top);
    ctx.fillRect(p.x,p.top+gapH,pipeW,canvas.height-p.top-gapH);
    ctx.shadowBlur = 0;
  });
}

function spawn(){
  const top = Math.random()*(canvas.height-gapH-120)+60;
  pipes.push({x:canvas.width, top, done:false});
}

function update(){
  if(state !== 'play') return;
  rocket.vy += gravity;
  rocket.y += rocket.vy;
  rocket.power = Math.max(rocket.power-0.06, 0.25);
  pipes.forEach((p,i) => {
    p.x -= speed;
    if(!p.done && p.x+pipeW < rocket.x){score++;p.done=true;}
    if(p.x+pipeW < 0) pipes.splice(i,1);
    if(rocket.x+rocket.w > p.x && rocket.x < p.x+pipeW && (rocket.y < p.top || rocket.y+rocket.h > p.top+gapH)) gameOver();
  });
  if(pipes.length === 0 || pipes[pipes.length-1].x < canvas.width-220) spawn();
  if(rocket.y < 0 || rocket.y+rocket.h > canvas.height) gameOver();
}

function gameOver(){
  state = 'over';
  if(score > best){best=score;localStorage.setItem('flappyBest',best);}
}

function jump(){
  if(state === 'start'){state='play';pipes=[];score=0;rocket.y=canvas.height/2;rocket.vy=jump;rocket.power=1;}
  else if(state === 'play'){rocket.vy=jump;rocket.power=1;}
  else if(state === 'over'){state='start';}
}

function draw(){
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  drawPipes();
  drawRocket();
  ctx.fillStyle = '#00f0ff';
  ctx.font = '22px Orbitron';
  ctx.textAlign = 'center';
  ctx.fillText(`SCORE: ${score}`, canvas.width/2, 35);
  ctx.fillText(`BEST: ${best}`, canvas.width/2, 65);
  if(state === 'start'){ctx.fillStyle='#00ffd5';ctx.font='26px Orbitron';ctx.fillText('TAP TO LAUNCH',canvas.width/2,canvas.height/2);}
  else if(state === 'over'){ctx.fillStyle='#ff4d6d';ctx.font='30px Orbitron';ctx.fillText('SYSTEM FAILURE',canvas.width/2,canvas.height/2-25);ctx.font='22px Orbitron';ctx.fillText('TAP TO REBOOT',canvas.width/2,canvas.height/2+25);}
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();

document.addEventListener('touchstart', jump);
document.addEventListener('mousedown', jump);
document.addEventListener('keydown', e => {if(e.code === 'Space') jump()});
</script>
</body>
</html>
