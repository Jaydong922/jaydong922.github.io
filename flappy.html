<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLAPPY BLUES 🚀 ROCKET EDITION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020510;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Orbitron',sans-serif}
canvas{border:2px solid #00d9ff;box-shadow:0 0 40px rgba(0,217,255,0.4);border-radius:12px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// GAME SETTINGS
let gameState = 'start';
let score = 0;
let highScore = localStorage.getItem('flappyHigh') || 0;
let gravity = 0.4;
let jumpForce = -8;
let speed = 3;

// ROCKET
const rocket = {
  x: 80,
  y: canvas.height/2,
  w: 40,
  h: 30,
  vy: 0,
  color: '#00d9ff',
  flame: 0
};

// PIPES
let pipes = [];
const pipeW = 60;
const gap = 150;

// BACKGROUND
const bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
bgGrad.addColorStop(0,'#001530');
bgGrad.addColorStop(1,'#000510');

// DRAW ROCKET
function drawRocket(){
  // Body
  ctx.fillStyle = rocket.color;
  ctx.shadowColor = '#00d9ff';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(rocket.x+rocket.w, rocket.y+rocket.h/2);
  ctx.lineTo(rocket.x, rocket.y);
  ctx.lineTo(rocket.x+10, rocket.y+rocket.h/2);
  ctx.lineTo(rocket.x, rocket.y+rocket.h);
  ctx.closePath();
  ctx.fill();
  // Flame
  rocket.flame = Math.min(rocket.flame+0.2, 1);
  ctx.fillStyle = `rgba(0,255,213,${rocket.flame})`;
  ctx.shadowColor = '#00ffd5';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.moveTo(rocket.x, rocket.y+rocket.h/2-5);
  ctx.lineTo(rocket.x-15*rocket.flame, rocket.y+rocket.h/2);
  ctx.lineTo(rocket.x, rocket.y+rocket.h/2+5);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
}

// DRAW PIPES
function drawPipes(){
  pipes.forEach(p => {
    const grad = ctx.createLinearGradient(p.x,0,p.x+pipeW,0);
    grad.addColorStop(0,'#0077ff');
    grad.addColorStop(1,'#00d9ff');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#00d9ff';
    ctx.shadowBlur = 10;
    // Top
    ctx.fillRect(p.x,0,pipeW,p.top);
    // Bottom
    ctx.fillRect(p.x,p.top+gap,pipeW,canvas.height-p.top-gap);
    ctx.shadowBlur = 0;
  });
}

// SPAWN PIPE
function spawnPipe(){
  const top = Math.random()*(canvas.height-gap-100)+50;
  pipes.push({x:canvas.width, top, passed:false});
}

// UPDATE GAME
function update(){
  if(gameState !== 'play') return;
  // Rocket physics
  rocket.vy += gravity;
  rocket.y += rocket.vy;
  rocket.flame = Math.max(rocket.flame-0.05, 0.2);
  // Pipes
  pipes.forEach((p,i) => {
    p.x -= speed;
    if(!p.passed && p.x+pipeW < rocket.x){
      score++;
      p.passed = true;
    }
    if(p.x+pipeW < 0) pipes.splice(i,1);
    // Collision
    if(rocket.x+rocket.w > p.x && rocket.x < p.x+pipeW && (rocket.y < p.top || rocket.y+rocket.h > p.top+gap)){
      gameOver();
    }
  });
  // Spawn new pipe
  if(pipes.length === 0 || pipes[pipes.length-1].x < canvas.width-200) spawnPipe();
  // Bounds
  if(rocket.y < 0 || rocket.y+rocket.h > canvas.height) gameOver();
}

// GAME OVER
function gameOver(){
  gameState = 'over';
  if(score > highScore){
    highScore = score;
    localStorage.setItem('flappyHigh', highScore);
  }
}

// JUMP
function jump(){
  if(gameState === 'start'){
    gameState = 'play';
    pipes = [];
    score = 0;
    rocket.y = canvas.height/2;
    rocket.vy = jumpForce;
  } else if(gameState === 'play'){
    rocket.vy = jumpForce;
    rocket.flame = 1;
  } else if(gameState === 'over'){
    gameState = 'start';
  }
}

// DRAW EVERYTHING
function draw(){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  drawPipes();
  drawRocket();
  // UI
  ctx.fillStyle = '#00d9ff';
  ctx.font = '20px Orbitron';
  ctx.textAlign = 'center';
  ctx.fillText(`SCORE: ${score}`, canvas.width/2, 30);
  ctx.fillText(`HIGH: ${highScore}`, canvas.width/2, 55);
  if(gameState === 'start'){
    ctx.fillStyle = '#00ffd5';
    ctx.font = '24px Orbitron';
    ctx.fillText('TAP TO START', canvas.width/2, canvas.height/2);
  } else if(gameState === 'over'){
    ctx.fillStyle = '#ff4d6d';
    ctx.font = '28px Orbitron';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2-20);
    ctx.font = '20px Orbitron';
    ctx.fillText('TAP TO TRY AGAIN', canvas.width/2, canvas.height/2+20);
  }
}

// LOOP
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// CONTROLS
document.addEventListener('touchstart', jump);
document.addEventListener('mousedown', jump);
document.addEventListener('keydown', e => {if(e.code === 'Space') jump()});
</script>
</body>
</html>
