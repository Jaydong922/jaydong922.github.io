<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLAPPY BLUES 🚀 ULTIMATE NEXT-GEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#00000a;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Orbitron',sans-serif}
canvas{border:3px solid #00f8ff;box-shadow:0 0 80px rgba(0,248,255,0.6);border-radius:20px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="game" width="450" height="700"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let state = 'start';
let score = 0;
let best = localStorage.getItem('flappyBest') || 0;
let gravity = 0.35;
let jumpPower = -7;
let speed = 3;

const rocket = {x:100,y:canvas.height/2,w:50,h:35,vy:0,power:0,tilt:0};
let pipes = [];
const pipeW = 70;
const gapH = 170;

const bg = ctx.createLinearGradient(0,0,0,canvas.height);
bg.addColorStop(0,'#001540');
bg.addColorStop(0.5,'#000a20');
bg.addColorStop(1,'#00000a');

function drawRocket(){
  rocket.power = Math.min(rocket.power+0.3, 1);
  rocket.tilt = Math.max(-0.4, Math.min(0.4, rocket.vy*0.05));
  
  ctx.save();
  ctx.translate(rocket.x+rocket.w/2, rocket.y+rocket.h/2);
  ctx.rotate(rocket.tilt);
  
  // Main Body
  ctx.fillStyle = '#00f8ff';
  ctx.shadowColor = '#00f8ff';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.moveTo(rocket.w/2, 0);
  ctx.lineTo(-rocket.w/2, -rocket.h/2+5);
  ctx.lineTo(-rocket.w/4, 0);
  ctx.lineTo(-rocket.w/2, rocket.h/2-5);
  ctx.closePath();
  ctx.fill();
  
  // Cockpit
  ctx.fillStyle = '#00a8cc';
  ctx.fillRect(-rocket.w/4+5, -rocket.h/4, 15, 20);
  
  // Energy Trail
  ctx.fillStyle = `rgba(0,255,213,${rocket.power})`;
  ctx.shadowColor = '#00ffd5';
  ctx.shadowBlur = 35;
  ctx.beginPath();
  ctx.moveTo(-rocket.w/2, -8);
  ctx.lineTo(-rocket.w/2-25*rocket.power, 0);
  ctx.lineTo(-rocket.w/2, 8);
  ctx.closePath();
  ctx.fill();
  
  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawPipes(){
  pipes.forEach(p => {
    const grad = ctx.createLinearGradient(p.x,0,p.x+pipeW,0);
    grad.addColorStop(0,'#0055ff');
    grad.addColorStop(1,'#00f8ff');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#00f8ff';
    ctx.shadowBlur = 20;
    
    // Top Pipe
    ctx.fillRect(p.x,0,pipeW,p.top);
    ctx.fillStyle = '#00a8cc';
    ctx.fillRect(p.x-5,p.top-20,pipeW+10,20);
    
    // Bottom Pipe
    ctx.fillStyle = grad;
    ctx.fillRect(p.x,p.top+gapH,pipeW,canvas.height-p.top-gapH);
    ctx.fillStyle = '#00a8cc';
    ctx.fillRect(p.x-5,p.top+gapH,pipeW+10,20);
    
    ctx.shadowBlur = 0;
  });
}

function spawnPipe(){
  const top = Math.random()*(canvas.height-gapH-150)+75;
  pipes.push({x:canvas.width, top, passed:false});
}

function update(){
  if(state !== 'play') return;
  
  rocket.vy += gravity;
  rocket.y += rocket.vy;
  rocket.power = Math.max(rocket.power-0.07, 0.2);
  
  pipes.forEach((p,i) => {
    p.x -= speed;
    if(!p.passed && p.x+pipeW < rocket.x){score++;p.passed=true;}
    if(p.x+pipeW < 0) pipes.splice(i,1);
    
    // Collision Check
    if(rocket.x+rocket.w-10 > p.x && rocket.x+10 < p.x+pipeW){
      if(rocket.y+rocket.h-10 < p.top || rocket.y+10 > p.top+gapH){gameOver();}
    }
  });
  
  if(pipes.length === 0 || pipes[pipes.length-1].x < canvas.width-250) spawnPipe();
  
  if(rocket.y < 0 || rocket.y+rocket.h > canvas.height) gameOver();
}

function gameOver(){
  state = 'over';
  if(  if(score > best){
    best = score;
    localStorage.setItem('flappyBest', best);
  }
}

function jump(){
  if(state === 'start'){
    state = 'play';
    pipes = [];
    score = 0;
    rocket.y = canvas.height / 2;
    rocket.vy = jumpPower;
    rocket.power = 1;
  }
  else if(state === 'play'){
    rocket.vy = jumpPower;
    rocket.power = 1;
  }
  else if(state === 'over'){
    state = 'start';
  }
}

function drawUI(){
  ctx.fillStyle = '#00f8ff';
  ctx.font = 'bold 26px Orbitron';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#00f8ff';
  ctx.shadowBlur = 20;
  ctx.fillText(`SCORE: ${score}`, canvas.width/2, 50);
  ctx.fillText(`BEST: ${best}`, canvas.width/2, 90);
  ctx.shadowBlur = 0;

  if(state === 'start'){
    ctx.fillStyle = '#00ffd5';
    ctx.font = 'bold 32px Orbitron';
    ctx.shadowColor = '#00ffd5';
    ctx.shadowBlur = 30;
    ctx.fillText('TAP TO LAUNCH', canvas.width/2, canvas.height/2);
    ctx.font = '18px Orbitron';
    ctx.fillText('FLAPPY BLUES • ULTIMATE EDITION', canvas.width/2, canvas.height/2 + 50);
  }
  else if(state === 'over'){
    ctx.fillStyle = '#ff4d6d';
    ctx.font = 'bold 36px Orbitron';
    ctx.shadowColor = '#ff4d6d';
    ctx.shadowBlur = 35;
    ctx.fillText('SYSTEM FAILURE', canvas.width/2, canvas.height/2 - 40);
    ctx.font = '22px Orbitron';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width/2, canvas.height/2 + 10);
    ctx.fillText('TAP TO REBOOT', canvas.width/2, canvas.height/2 + 50);
  }
  ctx.shadowBlur = 0;
}

function loop(){
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawPipes();
  drawRocket();
  drawUI();
  update();
  requestAnimationFrame(loop);
}
loop();

// Controls
document.addEventListener('touchstart', e => {e.preventDefault(); jump()});
document.addEventListener('mousedown', jump);
document.addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'ArrowUp'){
    e.preventDefault();
    jump();
  }
});
</script>
</body>
</html>
