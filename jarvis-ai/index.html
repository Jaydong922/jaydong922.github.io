cent);background:rgba(0,229,255,.1)}.c-btns .btn.spk:hover{border-color:#ffd34d;color:#ffd34d;background:rgba(255,211,77,.08)}.c-btns .btn.clr{border-color:var(--warn);color:var(--warn)}.c-btns .btn.clr:hover{background:rgba(255,56,96,.1)}.model-line{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}.model-line b{color:var(--accent2)}.upload{border:2px dashed var(--border);background:var(--panel);border-radius:3px;padding:14px;text-align:center;cursor:pointer;transition:.2s;margin:10px 0 6px}.upload:hover{border-color:var(--accent);background:rgba(0,229,255,.08)}.upload p{font-size:13px;color:var(--muted)}.upload small{font-size:10px;opacity:.75;display:block;margin-top:3px}.upload input{display:none}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin:6px 0}.thumb{position:relative;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:#000}.thumb img{width:100%;height:78px;object-fit:cover;display:block}.thumb .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#fff;border:0;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}.count{font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:1px}.count b{color:var(--accent)}.chat{height:360px;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:8px}.msg{max-width:88%;padding:9px 11px;border-radius:3px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}.msg .who{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7;margin-bottom:3px}.msg.u{align-self:flex-end;background:rgba(0,229,255,.1);border:1px solid var(--accent);color:var(--accent)}.msg.j{align-self:flex-start;background:rgba(176,38,255,.07);border:1px solid var(--accent2);color:var(--text)}.msg.err{border-color:var(--warn);color:var(--warn)}.msg img{max-width:160px;border-radius:2px;border:1px solid var(--border);margin-top:5px;display:block}.msg pre{background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:3px;padding:10px;margin:6px 0;overflow-x:auto;font-family:'Share Tech Mono',monospace;font-size:12.5px;line-height:1.5;color:#c8f7ff}.msg code{font-family:'Share Tech Mono',monospace;background:rgba(0,229,255,.1);padding:1px 5px;border-radius:2px;font-size:12.5px}.msg pre code{background:transparent;padding:0;color:inherit}.input-row{display:flex;gap:6px;margin-bottom:14px}.input-row input{flex:1;padding:11px 12px;background:rgba(0,0,0,.45);border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:inherit;font-size:13px;outline:none}.input-row input:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(0,229,255,.18)}footer{text-align:center;font-size:10px;color:var(--muted);letter-spacing:1.2px;line-height:1.6;margin-top:10px}.radar-wrap{position:relative;width:100%;max-width:620px;margin:14px auto 0;aspect-ratio:1/1}svg.radar{width:100%;height:100%;display:block}.sweep{transform-origin:center;animation:rot 4s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.blip{animation:bli 2.4s ease-in-out infinite}.blip:nth-child(2){animation-delay:.6s}.blip:nth-child(3){animation-delay:1.1s}.blip:nth-child(4){animation-delay:1.7s}@keyframes bli{0%,100%{opacity:0;r:2}40%{opacity:1;r:5}70%{opacity:.4;r:3.5}}@media (max-width:600px){.chat{height:320px}.c-btns .btn{min-width:96px;font-size:10px;padding:7px 9px}.msg pre{font-size:12px}}</style></head><body><div class="wrap"><div class="api-row"><label>GROQ API KEY</label><input id="key" type="password" placeholder="••••••••"><button class="btn btn-save" onclick="saveKey()">SAVE</button><button class="btn btn-test" onclick="testConn()">TEST</button><button class="btn btn-guide" onclick="window.open('https://console.groq.com/keys','_blank')">GET KEY</button></div><div class="ks" id="ks"></div><header><div class="h-top"><div class="title">CYBER<b>JAYD</b> // J.A.R.V.I.S OS</div><div class="status"><span class="dot"></span> SYSTEM READY</div></div><h1>GOOD AFTERNOON, SIR.</h1><div class="sub">FULL SYSTEM · VOICE · VISION · GLOBAL AI</div><div class="bars"><span></span><span></span><span></span><span></span><span></span></div></header><div class="controls"><div class="c-title">SYSTEM CONTROLS</div><div class="c-btns"><button class="btn" id="vBtn" onclick="toggleVoice()">VOICE: OFF</button><button class="btn spk" ontouchstart="listenStart()" ontouchend="listenStop()" onmousedown="listenStart()" onmouseup="listenStop()">HOLD TO SPEAK</button><button class="btn clr" onclick="clearAll()">CLEAR</button></div><div class="model-line">Model: <b>llama-3.3-70b-versatile</b></div></div><label class="upload"><p>📎 ATTACH 1 TO 10 IMAGES</p><small>screenshots · code · errors · diagrams · docs</small><input id="fileIn" type="file" accept="image/*" multiple></label><div class="thumbs" id="thumbs"></div><div class="count">Attached: <b id="nImg">0</b> / 10</div><div class="chat" id="chat"><div class="msg j"><div class="who">JARVIS</div>System initialized, Sir. Awaiting your command.</div></div><div class="input-row"><input id="inp" placeholder="Type or speak command…" onkeydown="if(event.key==='Enter')send()"><button class="btn btn-save" onclick="send()">SEND</button></div><footer>CYBERJAYD · 100% ANDROID BUILT · JAYD F. REPOBERBIO</footer><div class="radar-wrap"><svg class="radar" viewBox="-120 -120 240 240"><defs><radialGradient id="rg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00e5ff" stop-opacity=".35"/><stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/></radialGradient><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/><stop offset="100%" stop-color="#00e5ff" stop-opacity=".75"/></linearGradient></defs><circle r="110" fill="url(#rg)" stroke="rgba(0,229,255,.25)"/><circle r="85" fill="none" stroke="rg age fully, extract all text/code/errors/UI/diagrams/filenames/URLs, cross-reference, debug and fix. 6) ENGLISH ONLY. Calm precise JARVIS tone, no emojis. Use short paragraphs, numbered steps, bullets, code blocks, bold key terms. 7) Success-driven: every command is a mission; state assumptions if needed, deliver working paths first.`;let key=localStorage.getItem("groqKey")||"",voiceOn=!1,imgs=[],rec=null;const ksEl=document.getElementById("ks");key&&(document.getElementById("key").value=key,ksEl.textContent="KEY SAVED");function saveKey(){key=document.getElementById("key").value.trim();localStorage.setItem("groqKey",key);ksEl.textContent=key?"KEY SAVED":"";flash("✅ Key saved")}async function testConn(){if(!key)return flash("⚠️ Save key first");try{const r=await fetch(GROQ,{method:"POST",headers:{Authorization:`Bearer ${key}`,"Content-Type":"application/json"},body:JSON.stringify({model:MODEL,messages:[{role:"user",content:"ping"}],max_tokens:10})});flash(r.ok?"✅ OK":"❌ Check key")}catch(e){flash("❌ Network error")}}const fileIn=document.getElementById("fileIn"),thumbs=document.getElementById("thumbs"),nImg=document.getElementById("nImg");fileIn.addEventListener("change",e=>{const f=Array.from(e.target.files||[]);if(imgs.length+f.length>10){flash("⚠️ Max 10");e.target.value="";return}f.forEach(x=>{if(!x.type.startsWith("image/"))return;const r=new FileReader();r.onload=ev=>{imgs.push({name:x.name,data:ev.target.result});renderThumbs()};r.readAsDataURL(x)});e.target.value=""});function removeImg(i){imgs.splice(i,1);renderThumbs()}function renderThumbs(){thumbs.innerHTML="";imgs.forEach((im,i)=>{const d=document.createElement("div");d.className="thumb";d.innerHTML=`<img src="${im.data}"><button class="x" onclick="removeImg(${i})">×</button>`;thumbs.appendChild(d)});nImg.textContent=imgs.length}function toggleVoice(){voiceOn=!voiceOn;document.getElementById("vBtn").textContent="VOICE: "+(voiceOn?"ON":"OFF")}function SR(){return window.SpeechRecognition||window.webkitSpe r.json();const rep=d.choices?.[0]?.message?.content||(d.error?.message?"⚠️ Groq: "+d.error.message:"⚠️ No response");bot.innerHTML=`<div class="who">JARVIS</div>`+render(rep);chat.scrollTop=chat.scrollHeight;if(voiceOn&&"speechSynthesis"in window)try{const u=new SpeechSynthesisUtterance(rep.replace(/<[^>]+>/g,""));u.rate=1.03;speechSynthesis.speak(u)}catch(e){}}catch(err){bot.innerHTML=`<div class="who">ERROR</div>⚠️ ${err.message}`}imgs=[];renderThumbs()}</script></body></html>
