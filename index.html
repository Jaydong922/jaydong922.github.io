<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
/* ============================================
   BASE SYSTEM — 100% PRESERVED + ENHANCED
   ============================================ */
:root{
  --bg:#070b10;--bg2:#0f1620;--bg3:#141d2b;
  --panel:rgba(14,22,34,.92);--panel-2:rgba(10,16,26,.95);
  --blue:#00d4ff;--blue-2:#38bdf8;--blue-3:#7dd3fc;--blue-4:#bae6fd;
  --violet:#6366f1;--violet-2:#8b5cf6;--violet-3:#a78bfa;
  --cyan:#22d3ee;--green:#10b981;--yellow:#fbbf24;
  --text:#e6f1ff;--text-2:#b8c8e0;--text-3:#8896b0;--text-4:#5a6580;
  --line:rgba(0,212,255,.25);--line-2:rgba(99,102,241,.2);
  --glow:0 0 10px var(--blue),0 0 30px rgba(0,212,255,.45),0 0 60px rgba(0,212,255,.18);
  --glow-2:0 0 8px var(--blue-2),0 0 22px rgba(56,189,248,.35);
  --glow-v:0 0 10px var(--violet),0 0 30px rgba(99,102,241,.35);
  --shadow-3d:0 20px 45px rgba(0,0,0,.55),0 8px 18px rgba(0,212,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Rajdhani',sans-serif;
  background:
    radial-gradient(1200px 700px at 85% -10%,rgba(0,212,255,.12),transparent 60%),
    radial-gradient(900px 600px at -10% 30%,rgba(99,102,241,.10),transparent 55%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 50%,var(--bg3) 100%);
  color:var(--text);line-height:1.75;overflow-x:hidden;min-height:100vh;
}
h1,h2,h3,h4,h5{font-family:'Orbitron',sans-serif;letter-spacing:1.2px;font-weight:800}
.mono{font-family:'Share Tech Mono',monospace}
.exo{font-family:'Exo 2',sans-serif}

/* Matrix Background */
#matrix{position:fixed;inset:0;z-index:0;opacity:.18}
.grid-bg{
  position:fixed;inset:0;z-index:1;
  background:
    linear-gradient(rgba(0,212,255,.055)1px,transparent 1px)0 0/44px 44px,
    linear-gradient(90deg,rgba(136,150,176,.04)1px,transparent 1px)0 0/44px 44px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 85%);
}
.scanlines{
  position:fixed;inset:0;z-index:50;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22)2px 3px);
  mix-blend-mode:overlay;animation:scanM 8s linear infinite;
}
@keyframes scanM{from{background-position:0 0}to{background-position:0 100vh}}
.vignette{
  position:fixed;inset:0;z-index:40;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(3,6,12,.82)100%);
}
.wrap{position:relative;z-index:10}

/* Custom Scrollbar */
::-webkit-scrollbar{width:11px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--blue),var(--violet));
  border-radius:6px;box-shadow:var(--glow);
}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--blue-2),var(--violet-2))}

/* Navigation */
nav{
  position:sticky;top:0;z-index:1000;
  backdrop-filter:blur(18px) saturate(140%);
  background:rgba(7,11,16,.82);
  border-bottom:1px solid var(--line);
  box-shadow:0 6px 40px rgba(0,212,255,.12);
}
.nav-inner{
  max-width:1300px;margin:0 auto;padding:1rem 1.4rem;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;
}
.brand{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.35rem;
  color:var(--blue);text-shadow:var(--glow);letter-spacing:2.5px;
}
.brand span{color:var(--text)}
.nav-links{display:flex;gap:1.3rem;flex-wrap:wrap}
.nav-links a{
  color:var(--text-2);text-decoration:none;font-weight:600;
  font-family:'Orbitron',sans-serif;font-size:.82rem;letter-spacing:1.2px;
  padding:.35rem .2rem;border-bottom:2px solid transparent;
  transition:.25s ease;position:relative;cursor:pointer;
}
.nav-links a:hover,.nav-links a.active{
  color:var(--blue);border-color:var(--blue);text-shadow:var(--glow-2);
}

/* Section Base */
section{
  max-width:1300px;margin:0 auto;padding:6rem 1.4rem;
  opacity:0;transform:translateY(40px);
  transition:all .9s cubic-bezier(.2,.8,.2,1);
  position:relative;
}
section.visible{opacity:1;transform:translateY(0)}
.sec-head{
  display:flex;align-items:center;gap:1rem;margin-bottom:2.5rem;
  position:relative;
}
.sec-head .num{
  font-family:'Share Tech Mono',monospace;color:var(--violet-3);
  font-size:1rem;font-weight:700;
}
.sec-head h2{
  font-size:clamp(1.5rem,3vw,2.2rem);margin:0;flex:1;
  background:linear-gradient(90deg,var(--blue),var(--violet-2),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(0,212,255,.15);
}
.sec-head .line{
  height:2px;flex:1;
  background:linear-gradient(90deg,var(--blue),var(--violet),transparent);
  border-radius:2px;
}

/* Cards Base */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  padding:2rem;position:relative;overflow:hidden;
  transition:all .45s cubic-bezier(.2,.8,.2,1);
  backdrop-filter:blur(10px);
  border-radius:3px;
  transform-style:preserve-3d;
  box-shadow:var(--shadow-3d);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,212,255,.08),transparent 40%,rgba(99,102,241,.06));
  opacity:0;transition:.4s;pointer-events:none;
}
.card::after{
  content:'';position:absolute;top:0;left:-120%;width:80%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,212,255,.14),transparent);
  transition:.9s ease;pointer-events:none;
}
.card:hover{
  transform:translateY(-10px) rotateX(6deg);
  border-color:var(--blue-2);
  box-shadow:0 30px 70px rgba(0,0,0,.6),var(--glow-2);
}
.card:hover::before{opacity:1}
.card:hover::after{left:120%}
.grid{
  display:grid;gap:1.5rem;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
}

/* Tags */
.tag{
  display:inline-block;margin:.25rem;
  padding:.3rem .75rem;font-size:.8rem;font-weight:600;
  color:var(--blue-2);
  background:rgba(0,212,255,.07);
  border:1px solid var(--line);
  border-radius:2px;
  transition:.25s ease;
  font-family:'Exo 2',sans-serif;letter-spacing:.5px;
}
.tag:hover{
  background:var(--blue);color:var(--bg);
  box-shadow:var(--glow);transform:translateY(-2px);
}

/* Buttons */
.btn-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:2rem 0}
.cbtn{
  display:inline-block;padding:1rem 2.2rem;
  font-family:'Orbitron',sans-serif;font-weight:800;letter-spacing:2px;font-size:.95rem;
  color:var(--blue);background:transparent;
  border:2px solid var(--blue);text-decoration:none;cursor:pointer;
  position:relative;overflow:hidden;transition:.35s ease;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
.cbtn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,var(--blue),var(--violet));
  transform:translateX(-101%);transition:.4s ease;z-index:-1;
}
.cbtn:hover{
  color:var(--bg);border-color:transparent;text-shadow:none;
  box-shadow:var(--glow),0 10px 30px rgba(0,212,255,.35);
  transform:translateY(-3px);
}
.cbtn:hover::before{transform:translateX(0)}
.cbtn.secondary{
  color:var(--text-2);border-color:var(--text-3);
}
.cbtn.secondary:hover{
  color:var(--bg);border-color:transparent;
  box-shadow:0 10px 30px rgba(136,150,176,.25);
}
.cbtn.secondary::before{
  background:linear-gradient(120deg,var(--text-2),var(--text-3));
}

/* ============================================
   HERO — 3D DIGITAL EARTH + ENHANCED
   ============================================ */
.hero{
  min-height:100vh;display:grid;
  grid-template-columns:1.2fr 1fr;gap:3rem;
  align-items:center;padding:3rem 1.4rem 6rem;
  max-width:1300px;margin:0 auto;
  position:relative;overflow:visible;
}
.hero-left{text-align:left;position:relative;z-index:5}
.hero-kicker{
  display:inline-block;padding:.35rem 1rem;margin-bottom:1.5rem;
  font-family:'Share Tech Mono',monospace;font-size:.8rem;letter-spacing:2px;
  color:var(--cyan);
  border:1px solid var(--line);
  background:rgba(34,211,238,.06);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.glitch{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(2.4rem,6vw,4.8rem);line-height:1.05;
  background:linear-gradient(180deg,var(--blue-4),var(--blue) 40%,var(--violet-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(0,212,255,.35);
  position:relative;margin-bottom:1.2rem;letter-spacing:1.5px;
  animation:glowP 3.5s ease-in-out infinite;
}
@keyframes glowP{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.glitch-sub{
  font-family:'Exo 2',sans-serif;font-weight:600;
  font-size:clamp(1.1rem,2.5vw,1.6rem);
  color:var(--blue-2);margin-bottom:1.5rem;line-height:1.5;
}
.hero-desc{
  color:var(--text-2);font-size:1.1rem;line-height:1.9;
  max-width:620px;margin-bottom:2rem;
}
.hero-desc strong{color:var(--blue-3);font-weight:700}
.hero-desc .accent-v{color:var(--violet-3);font-weight:700}
.hero-desc .accent-y{color:var(--yellow);font-weight:700}

/* 3D Earth Container */
.hero-right{
  position:relative;height:520px;perspective:1200px;
  display:flex;align-items:center;justify-content:center;
}
.earth-wrap{
  position:relative;width:100%;max-width:460px;aspect-ratio:1/1;
  transform-style:preserve-3d;
  animation:floatY 7s ease-in-out infinite;
}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.earth-ring{
  position:absolute;inset:-12%;
  border:1px dashed rgba(0,212,255,.35);border-radius:50%;
  animation:spinR 22s linear infinite;
}
.earth-ring.r2{inset:-22%;border-color:rgba(99,102,241,.25);animation-duration:32s;animation-direction:reverse}
.earth-ring.r3{inset:-32%;border-color:rgba(34,211,238,.18);animation-duration:45s}
@keyframes spinR{to{transform:rotate(360deg)}}
#earthCanvas{
  width:100%;height:100%;display:block;
  filter:drop-shadow(0 0 30px rgba(0,212,255,.55)) drop-shadow(0 0 60px rgba(99,102,241,.25));
}
.earth-label{
  position:absolute;bottom:-2rem;left:50%;transform:translateX(-50%);
  font-family:'Share Tech Mono',monospace;font-size:.75rem;letter-spacing:2.5px;
  color:var(--text-3);white-space:nowrap;
}
.hero-stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;
  margin-top:3rem;padding-top:2rem;
  border-top:1px solid var(--line);
}
.stat{text-align:left}
.stat-num{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(1.5rem,3vw,2.3rem);
  background:linear-gradient(90deg,var(--blue),var(--violet-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:block;line-height:1;
}
.stat-label{
  font-size:.78rem;color:var(--text-3);
  font-family:'Exo 2',sans-serif;letter-spacing:1.2px;
  text-transform:uppercase;font-weight:600;margin-top:.3rem;
}

/* HUD Corners */
.hud{
  position:absolute;width:70px;height:70px;
  border:2px solid var(--blue);box-shadow:var(--glow);
  pointer-events:none;z-index:6;
}
.hud.tl{top:2rem;left:1rem;border-right:none;border-bottom:none}
.hud.tr{top:2rem;right:1rem;border-left:none;border-bottom:none}
.hud.bl{bottom:2rem;left:1rem;border-right:none;border-top:none}
.hud.br{bottom:2rem;right:1rem;border-left:none;border-top:none}

/* Hex Particles */
.hex-field{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.hex{
  position:absolute;width:40px;height:46px;opacity:.12;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  animation:hexFloat 14s linear infinite;
}
@keyframes hexFloat{
  0%{transform:translateY(110vh) rotate(0deg);opacity:0}
  10%{opacity:.18}
  90%{opacity:.18}
  100%{transform:translateY(-20vh) rotate(360deg);opacity:0}
}

/* ============================================
   NEW — TECH STACK HEX GRID
   ============================================ */
.hex-grid{
  display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;
  padding:2rem 0;
}
.hex-card{
  width:130px;height:150px;position:relative;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(99,102,241,.12));
  border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:.4s ease;cursor:default;text-align:center;padding:.5rem;
}
.hex-card:hover{
  transform:translateY(-8px) scale(1.06);
  background:linear-gradient(135deg,rgba(0,212,255,.3),rgba(99,102,241,.22));
  box-shadow:var(--glow);border-color:var(--blue-2);
}
.hex-icon{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:1.6rem;color:var(--blue-3);margin-bottom:.4rem;
  text-shadow:var(--glow-2);
}
.hex-name{
  font-size:.78rem;font-weight:700;color:var(--text);
  font-family:'Exo 2',sans-serif;letter-spacing:.8px;
}
.hex-level{
  font-family:'Share Tech Mono',monospace;font-size:.65rem;
  color:var(--violet-3);margin-top:.2rem;
}

/* ============================================
   NEW — MY PROCESS 3D STEPS
   ============================================ */
.process{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:1.5rem;position:relative;padding:2rem 0;
}
.step{
  position:relative;padding:2.5rem 1.5rem 1.5rem;text-align:center;
}
.step-num{
  position:absolute;top:-1.5rem;left:50%;transform:translateX(-50%);
  width:55px;height:55px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  color:var(--bg);display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.3rem;
  box-shadow:var(--glow);
}
.step h4{
  font-size:1.05rem;color:var(--blue-2);margin:1rem 0 .5rem;
  font-family:'Exo 2',sans-serif;letter-spacing:1px;
}
.step p{color:var(--text-2);font-size:.98rem;line-height:1.7}

/* ============================================
   SKILLS — PROGRESS BARS ENHANCED
   ============================================ */
.skill-wrap{margin-bottom:1.8rem}
.skill-head{
  display:flex;justify-content:space-between;margin-bottom:.6rem;font-weight:600;
}
.skill-name{color:var(--text-2);font-family:'Exo 2',sans-serif;font-size:1rem}
.skill-percent{
  color:var(--blue);font-family:'Share Tech Mono',monospace;font-weight:700;
}
.skill-bar{
  height:12px;background:rgba(136,150,176,.08);
  border-radius:3px;overflow:hidden;
  border:1px solid var(--line);
  position:relative;
}
.skill-fill{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--blue),var(--violet),var(--cyan));
  border-radius:3px;box-shadow:var(--glow);
  transition:width 1.8s cubic-bezier(.2,.8,.2,1);
  position:relative;
}
.skill-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shine 2.5s ease-in-out infinite;
}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ============================================
   TIMELINE ENHANCED
   ============================================ */
.timeline{position:relative;max-width:950px;margin:0 auto;padding-left:2.5rem}
.timeline::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--blue),var(--violet),var(--cyan));
  box-shadow:var(--glow);border-radius:2px;
}
.tl-item{position:relative;margin-bottom:3rem;padding-left:2rem}
.tl-item::before{
  content:'';position:absolute;left:-2.85rem;top:.4rem;
  width:20px;height:20px;border-radius:50%;
  background:var(--bg);border:3px solid var(--blue);
  box-shadow:var(--glow);
}
.tl-item:hover::before{background:var(--blue);transform:scale(1.2)}
.tl-date{
  font-family:'Share Tech Mono',monospace;
  color:var(--violet-3);font-size:.88rem;font-weight:700;
  letter-spacing:1.5px;margin-bottom:.4rem;
}
.tl-title{
  font-size:1.25rem;color:var(--blue-2);
  font-weight:700;margin-bottom:.5rem;
  font-family:'Exo 2',sans-serif;letter-spacing:.5px;
}
.tl-desc{color:var(--text-2);line-height:1.8;font-size:1rem}

/* ============================================
   PRICING — 3D TIERS
   ============================================ */
.pricing{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem;margin-top:3rem}
.price-card{text-align:center;padding:3rem 1.8rem;position:relative}
.price-card.featured{
  transform:scale(1.05);
  border-color:var(--violet);
  background:linear-gradient(180deg,rgba(99,102,241,.12),var(--panel));
}
.price-card.featured:hover{transform:scale(1.05) translateY(-10px);box-shadow:var(--glow-v)}
.price-badge{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:var(--bg);padding:.3rem 1.2rem;
  font-size:.75rem;font-weight:900;
  font-family:'Orbitron',sans-serif;letter-spacing:1.5px;
  box-shadow:var(--glow);
}
.price-name{
  font-size:1.15rem;color:var(--blue-2);
  font-family:'Orbitron',sans-serif;letter-spacing:2px;margin-bottom:.5rem;
}
.price-amount{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:3.2rem;margin:1.2rem 0;line-height:1;
  background:linear-gradient(180deg,var(--blue-4),var(--violet-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.price-amount span{font-size:1rem;color:var(--text-3);font-weight:500}
.price-list{list-style:none;margin:1.8rem 0 2rem;text-align:left}
.price-list li{
  padding:.65rem 0;border-bottom:1px dashed var(--line);
  color:var(--text-2);font-size:.98rem;display:flex;gap:.6rem;align-items:flex-start;
}
.price-list li::before{
  content:'';flex-shrink:0;margin-top:.55rem;
  width:8px;height:8px;border-radius:50%;
  background:var(--green);box-shadow:0 0 8px var(--green);
}

/* ============================================
   PROJECTS — 3D CARDS
   ============================================ */
.project-card{padding:0;overflow:hidden}
.project-img{
  height:210px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 30% 30%,rgba(0,212,255,.35),transparent 50%),
    radial-gradient(circle at 70% 70%,rgba(99,102,241,.35),transparent 50%),
    linear-gradient(135deg,var(--bg2),var(--bg3));
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;
  color:var(--blue-4);text-shadow:var(--glow);
}
.project-img::after{
  content:'';position:absolute;inset:0;

<script>
// Matrix Effect
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
chars = chars.split('');
let fontSize = 14;
let columns = canvas.width / fontSize;
let drops = [];
for(let x = 0; x < columns; x++) drops[x] = 1;
function drawMatrix(){
  ctx.fillStyle = 'rgba(7,11,16,.05)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#00d4ff';
  ctx.font = fontSize + 'px monospace';
  for(let i = 0; i < drops.length; i++){
    let text = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 50);

// Scroll Animation
const sections = document.querySelectorAll('section');
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{if(e.isIntersecting) e.target.classList.add('visible')})
},{threshold:0.1});
sections.forEach(s=>observer.observe(s));

// Skill Bars
document.querySelectorAll('.skill-fill').forEach(b=>{
  const w = b.dataset.width;
  setTimeout(()=>b.style.width = w+'%', 600);
});

// Counter Animation
document.querySelectorAll('.stat-num').forEach(el=>{
  const target = +el.dataset.target;
  let count = 0;
  const inc = target / 60;
  const update = ()=>{
    count += inc;
    if(count < target) {el.innerText = Math.floor(count); requestAnimationFrame(update);}
    else el.innerText = target;
  };
  update();
});

// Back to Top
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', ()=>{
  if(window.scrollY > 400) backTop.classList.add('show');
  else backTop.classList.remove('show');
});
backTop.addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));

// 3D Digital Earth
const earthCanvas = document.getElementById('earthCanvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45,1,0.1,1000);
const renderer = new THREE.WebGLRenderer({canvas:earthCanvas,alpha:true,antialias:true});
renderer.setSize(400,400);
const geometry = new THREE.SphereGeometry(1.8,64,64);
const material = new THREE.MeshBasicMaterial({
  color:0x00d4ff,wireframe:true,transparent:true,opacity:0.6
});
const earth = new THREE.Mesh(geometry,material);
scene.add(earth);
const glowGeom = new THREE.SphereGeometry(2.0,32,32);
const glowMat = new THREE.MeshBasicMaterial({
  color:0x6366f1,wireframe:true,transparent:true,opacity:0.2
});
const glow = new THREE.Mesh(glowGeom,glowMat);
scene.add(glow);
camera.position.z = 4.5;
function animateEarth(){
  requestAnimationFrame(animateEarth);
  earth.rotation.y += 0.003;
  earth.rotation.x += 0.001;
  glow.rotation.y -= 0.002;
  renderer.render(scene,camera);
}
animateEarth();

// FAQ Accordion
document.querySelectorAll('.faq-q').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const item = btn.parentElement;
    item.classList.toggle('open');
  });
});
</script>
