<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GALAXY WAR // SECTOR 01</title>
<meta name="description" content="Epic continuous space battle — fighters, lasers, explosions, and debris floating in deep space.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000510}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="galaxy"></canvas>
<script>
const canvas = document.getElementById('galaxy');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();

// COLORS
const DEEP_SPACE = '#000510';
const STAR_COLORS = ['#ffffff','#aaddff','#ffddaa','#ff8888','#88ffaa'];
const LASER_RED = '#ff2244';
const LASER_BLUE = '#22aaff';
const EXPLOSION_GLOW = '#ffaa00';
const DEBRIS_COLOR = '#8899aa';

// OBJECTS
const stars = [];
const ships = [];
const lasers = [];
const explosions = [];
const debris = [];

// CREATE STARS
for(let i=0;i<600;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*1.5+0.2,
    speed:Math.random()*0.3+0.05,
    color:STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)],
    twinkle:Math.random()*Math.PI*2
  });
}

// SHIP CLASS
class Ship{
  constructor(side){
    this.side = side; // 'red' or 'blue'
    this.x = side==='red' ? Math.random()*canvas.width*0.4 : canvas.width*0.6 + Math.random()*canvas.width*0.4;
    this.y = Math.random()*canvas.height;
    this.vx = (Math.random()-0.5)*1.5;
    this.vy = (Math.random()-0.5)*1.5;
    this.angle = Math.random()*Math.PI*2;
    this.size = 12 + Math.random()*8;
    this.health = 100;
    this.fireTimer = Math.random()*120;
    this.color = side==='red' ? '#ff3355' : '#3399ff';
    this.engineGlow = 0;
  }
  update(){
    // MOVE & BOUNCE
    this.x += this.vx;
    this.y += this.vy;
    this.angle += (Math.random()-0.5)*0.02;
    if(this.x<50||this.x>canvas.width-50) this.vx*=-0.9;
    if(this.y<50||this.y>canvas.height-50) this.vy*=-0.9;
    // ENGINE GLOW
    this.engineGlow = Math.sin(Date.now()*0.01+this.x)*0.5+0.5;
    // FIRE LASER
    this.fireTimer--;
    if(this.fireTimer<=0){
      this.fire();
      this.fireTimer = 80 + Math.random()*100;
    }
  }
  fire(){
    const dir = this.side==='red' ? 1 : -1;
    lasers.push({
      x:this.x, y:this.y,
      vx:dir*4 + this.vx, vy:this.vy,
      color:this.side==='red' ? LASER_RED : LASER_BLUE,
      life:250,
      width:3, height:12
    });
  }
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    // ENGINE GLOW
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 15 * this.engineGlow;
    // BODY
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(this.size,0);
    ctx.lineTo(-this.size*0.7, -this.size*0.4);
    ctx.lineTo(-this.size*0.4,0);
    ctx.lineTo(-this.size*0.7, this.size*0.4);
    ctx.closePath();
    ctx.fill();
    // DETAILS
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-this.size*0.2, -this.size*0.1, this.size*0.4, this.size*0.2);
    ctx.restore();
  }
  hit(){
    this.health -= 25;
    if(this.health<=0){
      explosions.push({x:this.x,y:this.y,r:0,maxR:this.size*4,alpha:1});
      for(let i=0;i<12;i++){
        debris.push({
          x:this.x,y:this.y,
          vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6,
          size:Math.random()*4+1,
          rot:Math.random()*Math.PI*2,
          rotSpeed:(Math.random()-0.5)*0.2,
          life:400
        });
      }
      return true;
    }
    return false;
  }
}

// SPAWN INITIAL SHIPS
for(let i=0;i<6;i++){
  ships.push(new Ship('red'));
  ships.push(new Ship('blue'));
}

// ANIMATION LOOP
function animate(){
  ctx.fillStyle = DEEP_SPACE;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // DRAW STARS
  stars.forEach(s=>{
    s.twinkle += 0.02;
    const alpha = 0.4 + Math.sin(s.twinkle)*0.3;
    ctx.fillStyle = s.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
    ctx.fill();
    s.x -= s.speed;
    if(s.x<0) s.x=canvas.width;
  });
  ctx.globalAlpha = 1;

  // UPDATE & DRAW SHIPS
  for(let i=ships.length-1;i>=0;i--){
    const s = ships[i];
    s.update();
    s.draw();
    // COLLISION WITH LASERS
    for(let j=lasers.length-1;j>=0;j--){
      const l = lasers[j];
      if(Math.hypot(s.x-l.x,s.y-l.y)<s.size+5){
        if((s.side==='red'&&l.color===LASER_BLUE)||(s.side==='blue'&&l.color===LASER_RED)){
          if(s.hit()) ships.splice(i,1);
          lasers.splice(j,1);
        }
      }
    }
  }

  // UPDATE & DRAW LASERS
  for(let i=lasers.length-1;i>=0;i--){
    const l = lasers[i];
    l.x += l.vx; l.y += l.vy; l.life--;
    if(l.life<=0||l.x<0||l.x>canvas.width||l.y<0||l.y>canvas.height){
      lasers.splice(i,1);
      continue;
    }
    ctx.fillStyle = l.color;
    ctx.shadowColor = l.color;
    ctx.shadowBlur = 12;
    ctx.fillRect(l.x-l.width/2,l.y-l.height/2,l.width,l.height);
  }
  ctx.shadowBlur = 0;

  // UPDATE & DRAW EXPLOSIONS
  for(let i=explosions.length-1;i>=0;i--){
    const e = explosions[i];
    e.r += 1.2; e.alpha -= 0.025;
    if(e.alpha<=0){explosions.splice(i,1);continue}
    ctx.strokeStyle = EXPLOSION_GLOW;
    ctx.lineWidth = 3;
    ctx.globalAlpha = e.alpha;
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = '#ff4400';
    ctx.globalAlpha = e.alpha*0.5;
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r*0.4,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // UPDATE & DRAW DEBRIS
  for(let i=debris.length-1;i>=0;i--){
    const d = debris[i];
    d.x += d.vx; d.y += d.vy; d.vx *= 0.995; d.vy *= 0.995;
    d.rot += d.rotSpeed; d.life--;
    if(d.life<=0){debris.splice(i,1);continue}
    ctx.fillStyle = DEBRIS_COLOR;
    ctx.globalAlpha = d.life/400;
    ctx.save();
    ctx.translate(d.x,d.y);
    ctx.rotate(d.rot);
    ctx.fillRect(-d.size/2,-d.size/2,d.size,d.size);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // KEEP SPAWNING SHIPS
  if(ships.length<12){
    ships.push(new Ship(Math.random()>0.5?'red':'blue'));
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
