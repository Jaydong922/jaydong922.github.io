<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERJAYD | GLOBAL GRID 3D EARTH</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r162/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r162/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000510; }
        #earth-container { width: 100vw; height: 100vh; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="earth-container"></div>
    <script>
    (function() {
        var container = document.getElementById('earth-container');
        var scene, camera, renderer, controls;
        var earth, earthGlow, earthWireframe, earthMainGroup;
        var clock = new THREE.Clock();

        function initCore() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000510, 0.0008);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 350);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000510, 1);
            container.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 200;
            controls.maxDistance = 600;
        }

        function createEarth() {
            var earthGroup = new THREE.Group();
            scene.add(earthGroup);
            var earthGeo = new THREE.SphereGeometry(100, 64, 64);
            var earthCanvas = document.createElement('canvas');
            earthCanvas.width = 512; earthCanvas.height = 256;
            var eCtx = earthCanvas.getContext('2d');
            eCtx.fillStyle = '#001a33'; eCtx.fillRect(0, 0, 512, 256);
            var continents = [
                {x:100,y:125,r:40,d:0.9},{x:225,y:110,r:45,d:0.95},
                {x:300,y:120,r:60,d:0.98},{x:340,y:160,r:40,d:0.85},
                {x:420,y:210,r:35,d:0.7},{x:100,y:220,r:40,d:0.75}
            ];
            continents.forEach(function(c){
                for(var i=0;i<Math.floor(200*c.d);i++){
                    var a = Math.random()*Math.PI*2, r = Math.random()*c.r;
                    var x = c.x + Math.cos(a)*r, y = c.y + Math.sin(a)*r;
                    eCtx.fillStyle = `rgba(80,200,255,${0.4+Math.random()*0.6})`;
                    eCtx.beginPath(); eCtx.arc(x,y,1,0,Math.PI*2); eCtx.fill();
                }
            });
            var earthTex = new THREE.CanvasTexture(earthCanvas);
            earth = new THREE.Mesh(earthGeo, new THREE.MeshBasicMaterial({ map: earthTex, transparent: true, opacity: 0.95 }));
            earthGroup.add(earth);
            earthWireframe = new THREE.Mesh(new THREE.SphereGeometry(100.5, 32, 24), new THREE.MeshBasicMaterial({ color: 0x4fc3f7, wireframe: true, transparent: true, opacity: 0.3 }));
            earthGroup.add(earthWireframe);
            earthGlow = new THREE.Mesh(new THREE.SphereGeometry(110, 32, 32), new THREE.ShaderMaterial({
                uniforms: { c: {value:0.5}, p:{value:4}, cG:{value: new THREE.Color(0x00bfff)} },
                vertexShader: `varying vec3 vN; void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
                fragmentShader: `uniform vec3 cG; uniform float c; uniform float p; varying vec3 vN; void main(){float i=pow(c-dot(vN,vec3(0,0,1)),p);gl_FragColor=vec4(cG,1.0)*i;}`,
                side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending
            }));
            earthGroup.add(earthGlow);
            return earthGroup;
        }

        function animate() {
            requestAnimationFrame(animate);
            var time = clock.getElapsedTime();
            earthMainGroup.rotation.y += 0.05;
            earthWireframe.rotation.y += 0.01;
            earthGlow.rotation.y -= 0.02;
            earthGlow.scale.setScalar(1 + Math.sin(time*0.5)*0.02);
            controls.update(); renderer.render(scene,camera);
        }

        window.addEventListener('resize', function(){
            camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth,window.innerHeight);
        });

        initCore();
        earthMainGroup = createEarth();
        animate();
    })();
    </script>
</body>
</html>
